<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مفاجأة عيد الميلاد 🦐</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#39213f,#120f1b 65%);color:#fff;display:grid;place-items:center;padding:22px}
    .page{width:min(680px,100%);text-align:center}
    h1{font-size:clamp(28px,6vw,48px);margin:8px 0 18px;color:#ffe2a8;text-shadow:0 4px 20px #0008}
    .sub{color:#eadff0;margin:0 0 18px}
    .panel{background:#ffffff12;border:1px solid #ffffff2b;border-radius:24px;padding:18px;box-shadow:0 18px 60px #0006;backdrop-filter:blur(8px)}
    video{width:100%;max-height:360px;border-radius:16px;background:#08070b;display:block}
    button{border:0;border-radius:999px;padding:15px 32px;font-size:23px;font-weight:bold;background:linear-gradient(135deg,#ffcf70,#ff8e9e);color:#351629;cursor:pointer;box-shadow:0 8px 24px #0005;transition:transform .15s}
    button:active{transform:scale(.96)}
    button:disabled{opacity:.7;cursor:wait}
    #count{font-size:14px;color:#f8dce8;min-height:22px;margin:12px 0 0}
    #second{display:none;overflow:hidden}
    .flower-wrap{height:170px;position:relative;margin:0 auto 4px;z-index:2;pointer-events:none}
    .flower{font-size:100px;position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);animation:rise 2s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 8px 12px #0005)}
    @keyframes rise{to{bottom:0}}
    .photo-wrap{min-height:300px;display:grid;place-items:start center;margin-top:-8px;overflow:visible}
    .photo{display:block;width:min(100%,420px);max-height:460px;object-fit:cover;border-radius:20px;border:4px solid #ffe2a8;opacity:0;transform:translateY(-175px) scale(.12);transform-origin:50% 0;animation:photoBloom 1.65s cubic-bezier(.16,1,.3,1) 1.25s forwards;box-shadow:0 16px 45px #0008;position:relative;z-index:1}
    @keyframes photoBloom{0%{opacity:0;transform:translateY(-175px) scale(.12);border-radius:50%}55%{opacity:1;border-radius:28px}100%{opacity:1;transform:translateY(0) scale(1);border-radius:20px}}
    .wish{font-size:clamp(25px,5vw,38px);line-height:1.7;color:#ffe2a8;margin:20px 0 4px}
    .wish2{font-size:20px;color:#fff;margin:0 0 18px}
    .music{font-size:16px;padding:12px 22px;margin-top:10px}
    .tiny{font-size:12px;color:#cbbdce;margin-top:16px}
  </style>
</head>
<body>
  <main class="page">
    <section id="first" class="panel">
      <h1>هشق الجمبري للمرور 🦐</h1>
      <p class="sub">استنى بس... فيه إجراءات أمنية لازم تخلصها الأول</p>
      <video id="clip" playsinline preload="metadata" controls>
        <source src="birthday-video.mp4" type="video/mp4">
        المتصفح لا يدعم تشغيل الفيديو.
      </video>
      <audio id="introMusic" preload="auto" loop>
        <source src="birthday-song.mp3" type="audio/mpeg">
      </audio>
      <div style="margin-top:20px">
        <button id="zara">زارا</button>
        <div id="count">اضغط على زارا 3 مرات عشان نسمحلك بالمرور 😂</div>
      </div>
    </section>

    <section id="second" class="panel">
      <div class="flower-wrap"><div class="flower">🌹</div></div>
      <div class="photo-wrap">
        <img class="photo" src="birthday-photo.jpeg" alt="صورة صاحب عيد الميلاد">
      </div>
      <div class="wish">كل عام وأنت بخير ❤️</div>
      <p class="wish2">عام مليء بالسعادة</p>
    </section>
  </main>
<script>
  const button = document.getElementById('zara');
  const countText = document.getElementById('count');
  const clip = document.getElementById('clip');
  const first = document.getElementById('first');
  const second = document.getElementById('second');
  const introMusic = document.getElementById('introMusic');
  let taps = 0;
  let started = false;

  button.addEventListener('click', async () => {
    if (started) return;
    taps++;
    countText.textContent = taps < 3 ? `فاضلك ${3-taps} ضغطة... ركّز 😂` : 'تم قبول طلب المرور... جهّز نفسك!';
    if (taps === 3) {
      started = true;
      button.disabled = true;
      button.textContent = 'جاري فتح البوابة...';
      try {
        // يبدأ الصوت بعد أول تفاعل من المستخدم حتى يسمح المتصفح بتشغيله.
        introMusic.volume = 0.45;
        await introMusic.play();
        await clip.play();
      } catch (e) {
        countText.textContent = 'اضغط علامة التشغيل ▶️ في الفيديو عشان يبدأ';
        button.disabled = false;
        started = false;
      }
    }
  });

  clip.addEventListener('ended', () => {
    // تنتهي موسيقى الصفحة الأولى تمامًا عند الانتقال للصفحة الثانية.
    introMusic.pause();
    introMusic.currentTime = 0;
    first.style.display = 'none';
    second.style.display = 'block';
    window.scrollTo({top:0,behavior:'smooth'});
  });
</script>
</body>
</html>
